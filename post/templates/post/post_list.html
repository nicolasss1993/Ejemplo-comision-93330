{% extends "post/base.html" %}

{% block contenido %}
    <h1>Mi Blog</h1>
    <button type="button">
        <a href="{% url 'post_create' %}">Crear Post</a>
    </button>
    <h2>Lista de posts</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Autor</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for post in post_tecnologia %}
                    <tr>
                        <td>{{ post.titulo }}</td>
                        <td>{{ post.autor }}</td>
                        <td>{{ post.fecha_creacion }}</td>
                        <td>
                            <a class="btn btn-succes btn-sm" href="{% url 'post_detail' post.id %}">Ver</a>
                            <a class="btn btn-warning btn-sm"
                               href="{% url 'post_update' post.id %}">Editar</a>
                            <a class="btn btn-danger btn-sm"
                               href="{% url 'post_delete' post.id %}">Eliminar</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4" class="text-center">No hay registros</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock contenido %}
