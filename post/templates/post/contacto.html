{% extends "post/base.html" %}

{% block titulo %}Contacto | Mi Blog{% endblock titulo %}

{% block contenido %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <h1 class="h2 text-center mb-2">Contacto</h1>
                    <p class="text-muted text-center mb-4">
                        Escribinos tu mensaje y nos pondremos en contacto con vos a la brevedad.
                    </p>
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                            <input type="text"
                                   id="nombre"
                                   name="nombre"
                                   class="form-control"
                                   placeholder="Tu nombre"
                                   required />
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="tu@email.com"
                                   required />
                        </div>
                        <div class="mb-4">
                            <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                            <textarea id="mensaje"
                                      name="mensaje"
                                      rows="5"
                                      class="form-control"
                                      placeholder="¿En qué te podemos ayudar?"
                                      required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="bi bi-send me-1"></i>Enviar mensaje
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock contenido %}
