{% extends "post/base.html" %}

{% block titulo %}Inicio | Mi Blog{% endblock titulo %}

{% block contenido %}
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7 text-center">
                <p class="lead mb-4">
                    ¡Bienvenidos! Leé, escribí y compartí tus ideas con la comunidad.
                </p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <a class="btn btn-primary text-uppercase" href="{% url 'post_list' %}">
                        <i class="bi bi-journal-text me-1"></i>Ver posts
                    </a>
                    {% if not user.is_authenticated %}
                        <a class="btn btn-outline-secondary text-uppercase" href="{% url 'registro' %}">
                            Crear cuenta
                        </a>
                    {% else %}
                        <a class="btn btn-outline-secondary text-uppercase" href="{% url 'post_create' %}">
                            Escribir un post
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endblock contenido %}
