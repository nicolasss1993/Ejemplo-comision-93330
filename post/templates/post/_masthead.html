{% load static %}
<header class="masthead" style="background-image: url('{% static imagen %}')">
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="{{ clase|default:'site-heading' }}">
                    <h1>{{ titulo }}</h1>
                    {% if subtitulo %}<span class="subheading">{{ subtitulo }}</span>{% endif %}
                </div>
            </div>
        </div>
    </div>
</header>
